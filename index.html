<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minhas Finanças</title>
<meta name="theme-color" content="#1E6B50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de celular — seletor Pessoal/Mercadorias no topo, caixa do Apple Pay, resumo da área, abas configuráveis e botão fixo de lançar */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --line:#D2DBD4;
  --fg:#16211C; --muted:#5B6B62;
  --acc-p:#1E6B50; --acc-p-soft:#D6EBE1;
  --acc-m:#1F4E79; --acc-m-soft:#D8E4F1;
  --on-acc:#FFFFFF;
  --good:#1E7A4C; --good-soft:#D6EBE1; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B4312A; --bad-soft:#F8DCD9;
  --ap:#111111; --ap-soft:#ECECEC;
  --credito:#5B4BC4; --pix:#0E8C86; --debito:#2F6BB3; --dinheiro:#8A6A1F;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --sunk:#121A16; --line:#2A362F;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --acc-p:#5FC79D; --acc-p-soft:#1D3A2D;
  --acc-m:#7FB2E5; --acc-m-soft:#1B2C3D;
  --on-acc:#06150E;
  --good:#5FC79D; --good-soft:#1D3A2D; --warn:#E8AA45; --warn-soft:#3A2C12; --bad:#F07A70; --bad-soft:#3F1E1B;
  --ap:#F2F2F2; --ap-soft:#2A2A2A;
  --credito:#A99BFF; --pix:#4CC9C1; --debito:#7DB0F0; --dinheiro:#D9B45A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --sunk:#121A16; --line:#2A362F;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --acc-p:#5FC79D; --acc-p-soft:#1D3A2D;
  --acc-m:#7FB2E5; --acc-m-soft:#1B2C3D;
  --on-acc:#06150E;
  --good:#5FC79D; --good-soft:#1D3A2D; --warn:#E8AA45; --warn-soft:#3A2C12; --bad:#F07A70; --bad-soft:#3F1E1B;
  --ap:#F2F2F2; --ap-soft:#2A2A2A;
  --credito:#A99BFF; --pix:#4CC9C1; --debito:#7DB0F0; --dinheiro:#D9B45A; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  --accent:var(--acc-p);--accent-soft:var(--acc-p-soft)}
body[data-area="merc"]{--accent:var(--acc-m);--accent-soft:var(--acc-m-soft)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.top small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:6px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:1.1rem}
.month span{min-width:78px;text-align:center;font-weight:700;font-size:.88rem;text-transform:capitalize}
.gear{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.area{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.area button{border:0;background:none;padding:10px 6px;border-radius:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.area button i{width:9px;height:9px;border-radius:50%}
.area button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.1)}


.inbox{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ap);background:var(--surface);border-radius:14px;padding:11px 12px;width:100%;text-align:left}
.inbox .ic{width:38px;height:38px;border-radius:10px;background:var(--ap);color:var(--bg);display:grid;place-items:center;flex:none;font-weight:800;font-size:.72rem;letter-spacing:.02em}
.inbox b{display:block}
.inbox span{font-size:.82rem;color:var(--muted)}
.inbox em{margin-left:auto;font-style:normal;font-weight:800;color:var(--accent);white-space:nowrap}
.hero{background:var(--accent);color:var(--on-acc);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:2.35rem;line-height:1;letter-spacing:-.02em}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .row div{background:color-mix(in srgb,var(--on-acc) 13%,transparent);border-radius:12px;padding:8px 10px;min-width:0}
.hero .row b{display:block;font-size:.94rem;letter-spacing:-.01em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .row span{font-size:.7rem;opacity:.88}
.hero .bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-acc) 22%,transparent);overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--on-acc);border-radius:99px}
.hero .note{font-size:.8rem;opacity:.92}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:1rem;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 em{white-space:nowrap;font-style:normal;font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:500}

.wk-num{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wk-num b{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.wk-num span{color:var(--muted);font-size:.85rem}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--good)}
.meter.w i{background:var(--warn)} .meter.b i{background:var(--bad)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--good-soft);color:var(--good);white-space:nowrap;border:0}
.chip.w{background:var(--warn-soft);color:var(--warn)} .chip.b{background:var(--bad-soft);color:var(--bad)}
.wk-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.wk-list div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}

.split{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.split div{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split span{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.split b{font-size:1.02rem}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:9px 2px;border-radius:9px;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.08)}

.list{display:flex;flex-direction:column}
.item{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{font-weight:700;text-align:right}
.item .m{font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.item .s{text-align:right}
.tag{font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.tag.ap{color:var(--ap)}
.day{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:10px}
.empty{color:var(--muted);font-size:.9rem;padding:12px 2px}

.fx{display:grid;grid-template-columns:auto minmax(0,1fr) 104px auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.fx input[type=text]{width:100%;min-width:0;border:1px solid transparent;background:none;border-radius:8px;padding:6px}
.fx input[type=text]:focus{border-color:var(--line);background:var(--sunk)}
.fx .val{text-align:right}
.fx input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:1.15rem}
.x.armed{background:var(--bad-soft);color:var(--bad)}
.sum{display:flex;justify-content:space-between;padding-top:10px;font-weight:700}
.ghost{border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;width:100%;color:var(--accent);font-weight:700;margin-top:8px}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}

.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;justify-content:center;pointer-events:none;z-index:4}
.fab button{pointer-events:auto;width:100%;max-width:528px;border:0;border-radius:14px;padding:15px;background:var(--fg);color:var(--bg);font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgb(0 0 0/.18)}

.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0/.42);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:93%;overflow:auto;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 2px;flex:none}
.sheet h2{font-size:1.2rem;font-weight:800}
.sheet h3{font-family:var(--f-display);font-size:1rem;margin:4px 0 0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=url],select{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:11px 12px;width:100%;font-size:16px;min-width:0}
.money{font-family:var(--f-display);font-weight:800;font-size:1.8rem!important;padding:10px 12px!important}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button,.seg2 button,.seg3 button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 2px;font-weight:600;font-size:.86rem}
.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"],.seg3 button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#lArea button[data-v="pessoal"][aria-pressed="true"]{background:var(--acc-p);border-color:var(--acc-p);color:var(--on-acc)}
#lArea button[data-v="merc"][aria-pressed="true"]{background:var(--acc-m);border-color:var(--acc-m);color:var(--on-acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1 1 auto;border-radius:12px;padding:13px;font-weight:700;border:1px solid var(--line);background:var(--sunk)}
.acts .pri{background:var(--accent);color:var(--on-acc);border-color:var(--accent)}
.acts .del{flex:0 0 auto;color:var(--bad)}
.acts .del.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.err{color:var(--bad);font-size:.85rem}
.ap-note{display:flex;gap:8px;align-items:center;background:var(--ap-soft);border-radius:10px;padding:9px 11px;font-size:.86rem}
.ap-note b{font-size:.68rem;letter-spacing:.06em;background:var(--ap);color:var(--bg);padding:2px 6px;border-radius:5px}
.status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.status i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--good)}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:.9rem}
.copyrow button,.small-btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 12px;font-weight:700;font-size:.86rem;white-space:nowrap}
details{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details summary{padding:12px 0;font-weight:700;cursor:pointer}
details ol{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
details ol li b{font-weight:700}
pre{margin:0;background:var(--sunk);border-radius:10px;padding:10px;font-size:.72rem;line-height:1.4;overflow:auto;max-height:200px;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.hero .big{font-size:2rem}.fx{grid-template-columns:auto minmax(0,1fr) 88px auto}.month span{min-width:66px}}
/* --- abas configuráveis --- */
.tabsbar{display:flex;gap:6px;align-items:center}
.tabs{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;border:0;background:none;padding:9px 12px;border-radius:9px;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.tabedit{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.tabedit svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.erow input{padding:9px 10px!important}
.erow small{display:block;color:var(--muted);font-size:.72rem;padding-left:2px}
.mini{border:1px solid var(--line);background:var(--sunk);width:34px;height:34px;border-radius:9px;font-size:.95rem;display:grid;place-items:center}
.mini:disabled{opacity:.35}
.kinds{display:grid;gap:6px}
.kinds button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px}
.kinds button b{font-size:.92rem}
.kinds button span{font-size:.78rem;color:var(--muted)}
.kinds button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kinds button[aria-pressed="true"] span{color:var(--fg)}
.abas{display:flex;flex-wrap:wrap;gap:6px}
.abas button{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.86rem}
.abas button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))!important}
.unit{font-size:.8rem;color:var(--muted);margin-top:2px}
/* --- estoque --- */
.stock{display:flex;flex-direction:column}
.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.prod:last-child{border-bottom:0}
.prod .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prod .q{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-align:right;line-height:1.1}
.prod .q small{font-family:var(--f-body);font-size:.72rem;font-weight:600;color:var(--muted)}
.prod .m{font-size:.78rem;color:var(--muted)}
.prod .s{text-align:right}
.prod.low .q{color:var(--warn)} .prod.out .q{color:var(--bad)}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.kpi3 div{background:var(--sunk);border-radius:12px;padding:9px 10px;min-width:0}
.kpi3 span{display:block;font-size:.7rem;color:var(--muted)}
.kpi3 b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* --- fiado --- */
.clis{display:flex;flex-direction:column}
.cli{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.cli:last-child{border-bottom:0}
.ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:.9rem;flex:none}
.ava.big{width:52px;height:52px;font-size:1.05rem}
.cn{min-width:0}.cn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cn small{display:block;font-size:.76rem;color:var(--muted)}
.cv{font-weight:800;color:var(--good);font-size:.92rem;white-space:nowrap}.cv.deve{color:var(--warn)}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clihead{display:flex;gap:12px;align-items:center}
.saldo{background:var(--good-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:1px}
.saldo.deve{background:var(--warn-soft)}
.saldo span{font-size:.74rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.saldo b{font-family:var(--f-display);font-size:1.9rem;font-weight:800;color:var(--good)}.saldo.deve b{color:var(--warn)}
.saldo small{font-size:.8rem;color:var(--muted)}
.wa{display:block;text-align:center;border-radius:12px;padding:12px;font-weight:700;text-decoration:none;background:#1F8F4E;color:#fff}
.lbl2{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
/* --- sincronização --- */
.top h1 small{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.syncpill{border:0;background:var(--good-soft);color:var(--good);font:inherit;font-size:.66rem;letter-spacing:.04em;text-transform:none;font-weight:700;padding:2px 8px;border-radius:99px;cursor:pointer}
.syncpill.run{background:var(--sunk);color:var(--muted)}
.syncpill.err{background:var(--warn-soft);color:var(--warn)}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlS=n=>Math.abs(n)>=1000?(n<0?'-':'')+'R$ '+Math.round(Math.abs(n)).toLocaleString('pt-BR'):brl(n);
const fmt2=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
function money(s){
  if(typeof s==='number')return isFinite(s)?Math.round(s*1000)/1000:NaN;
  s=String(s||'').replace(/[^\d.,-]/g,'');if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');let dec=-1;
  if(lc>=0&&ld>=0)dec=Math.max(lc,ld);
  else{const i=lc>=0?lc:ld;if(i>=0){const sep=s[i],cnt=s.split(sep).length-1,after=s.length-i-1;if(cnt===1&&(after!==3||sep===','))dec=i}}
  const n=dec>=0?parseFloat(s.slice(0,dec).replace(/[.,]/g,'')+'.'+s.slice(dec+1)):parseFloat(s.replace(/[.,]/g,''));
  return isFinite(n)?Math.round(n*1000)/1000:NaN;
}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
const fmtDay=s=>{const d=fromIso(s);return d.getDate()+' '+MESES[d.getMonth()]};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const sum=(a,f=x=>x.valor)=>a.reduce((t,x)=>t+(+f(x)||0),0);

const PALETA=['var(--credito)','var(--pix)','var(--debito)','var(--dinheiro)','#C2410C','#7C3AED','#0F766E','#BE185D'];
const UNIDADES=['un','kg','g','L','ml','cx','pct','dz','m'];
const KINDS={
  saida:{nome:'Gastos',desc:'Lista de saídas com valor, forma de pagamento e categoria',lanca:true,sinal:-1},
  entrada:{nome:'Entradas',desc:'Lista de dinheiro que entrou: salário, recebimentos, ressarcimentos',lanca:true,sinal:1},

};
const KEY='minhas-financas-v1',LKEY='minhas-financas-local';
function rnd(n){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';const r=new Uint32Array(n);crypto.getRandomValues(r);r.forEach(v=>s+=a[v%a.length]);return s}

/* ===== Junção de dados entre aparelhos (o mesmo código roda no script da planilha) ===== */
function mergeEstado(a, b) {
  a = a || {}; b = b || {};
  var out = { v: 4 };
  var ca = a.cfg || { u: -1 }, cb = b.cfg || { u: -1 };
  out.cfg = (cb.u || 0) >= (ca.u || 0) ? cb : ca;
  var listas = {};
  [a, b].forEach(function (o) { Object.keys(o).forEach(function (k) { if (Array.isArray(o[k])) listas[k] = true; }); });
  Object.keys(listas).forEach(function (k) {
    var m = {};
    (a[k] || []).forEach(function (x) { if (x && x.id) m[x.id] = x; });
    (b[k] || []).forEach(function (x) {
      if (!x || !x.id) return;
      var o = m[x.id];
      if (!o || (x.u || 0) >= (o.u || 0)) m[x.id] = x;
    });
    out[k] = Object.keys(m).map(function (id) { return m[id]; });
  });
  var pa = a.pagos || {}, pb = b.pagos || {};
  out.pagos = {};
  Object.keys(pa).forEach(function (k) { out.pagos[k] = pa[k]; });
  Object.keys(pb).forEach(function (k) {
    if (!out.pagos[k] || (pb[k].u || 0) >= (out.pagos[k].u || 0)) out.pagos[k] = pb[k];
  });
  return out;
}

function defaults(){return{v:4,
  cfg:{u:0,nome:'Mateus Torres',
    areas:[{id:'pessoal',nome:'Pessoal'},{id:'merc',nome:'Mercadorias'}],
    formas:[{id:'credito',nome:'Crédito'},{id:'pix',nome:'Pix'},{id:'debito',nome:'Débito'},{id:'dinheiro',nome:'Dinheiro'}],
    categorias:['Lazer','Comida','Transporte','Compras','Saúde','Estudos','Assinaturas','Outros']},
  abas:[
    {id:'p-gastos',area:'pessoal',nome:'Gastos',tipo:'saida',ordem:1,u:0},
    {id:'p-fixos',area:'pessoal',nome:'Fixos',tipo:'fixo',ordem:2,u:0},
    {id:'p-entradas',area:'pessoal',nome:'Entradas',tipo:'entrada',ordem:3,u:0},
    {id:'m-compras',area:'merc',nome:'Compras',tipo:'compra',ordem:4,u:0},
    {id:'m-vendas',area:'merc',nome:'Vendas',tipo:'venda',ordem:5,u:0},
    {id:'m-fiado',area:'merc',nome:'Fiado',tipo:'fiado',ordem:5.5,u:0},
    {id:'m-estoque',area:'merc',nome:'Estoque',tipo:'estoque',ordem:6,u:0}],
  produtos:[],clientes:[],fixos:[],lanc:[],pagos:{}}}
function localDefaults(){return{sync:{url:'',token:'mt-'+rnd(12),lastSync:null,erro:null},importados:[],fotosPend:[],backupEm:null}}

/* ===== Migração das versões anteriores ===== */
function fromV2(d){ // abas fixas -> v3
  const c={nome:d.config.nome,areas:null,abas:[
      {id:'p-gastos',area:'pessoal',nome:'Gastos',tipo:'saida'},{id:'p-fixos',area:'pessoal',nome:'Fixos',tipo:'fixo'},{id:'p-entradas',area:'pessoal',nome:'Entradas',tipo:'entrada'},
      {id:'m-compras',area:'merc',nome:'Compras',tipo:'compra'},{id:'m-vendas',area:'merc',nome:'Vendas',tipo:'venda'},{id:'m-estoque',area:'merc',nome:'Estoque',tipo:'estoque'}],
    fixos:{},produtos:[],sync:d.config.sync};
  const old=d.config||{};
  if(Array.isArray(old.fixosP)&&old.fixosP.length)c.fixos['p-fixos']=old.fixosP;
  if(Array.isArray(old.fixosM)&&old.fixosM.length){c.abas.push({id:'m-fixos',area:'merc',nome:'Fixos',tipo:'fixo'});c.fixos['m-fixos']=old.fixosM}
  const lanc=[];
  (d.lanc||[]).forEach(x=>{
    if(x.pendente){lanc.push(x);return}
    let a=null;
    if(x.area==='pessoal')a=x.tipo==='entrada'?'p-entradas':'p-gastos';
    else if(x.area==='merc'){
      if(x.tipo==='compra')a='m-compras';
      else if(x.tipo==='entrada'){if(!c.abas.find(z=>z.id==='m-entradas'))c.abas.push({id:'m-entradas',area:'merc',nome:'Entradas',tipo:'entrada'});a='m-entradas'}
      else if(x.tipo==='ressarc'){if(!c.abas.find(z=>z.id==='m-ressarc'))c.abas.push({id:'m-ressarc',area:'merc',nome:'Ressarcimentos',tipo:'entrada'});a='m-ressarc'}
    }
    if(a)lanc.push({id:x.id,abaId:a,valor:x.valor,desc:x.desc,data:x.data,mes:x.mes,forma:x.forma||null,cat:x.cat||null,qtd:x.qtd||null,produtoId:null,origem:x.origem,local:x.local,cartao:x.cartao,criado:x.criado||0});
  });
  const pg={};Object.entries(d.pagos||{}).forEach(([m,o])=>pg[m]=o);
  return{config:c,lanc,pagos:pg,importados:d.importados||[],backupEm:d.backupEm||null};
}
function fromV3(d){ // v3 -> v4 (tudo marcado como alterado agora para prevalecer sobre um aparelho novo)
  const t=now(),b=defaults(),c=d.config||{},L=localDefaults();
  b.cfg={u:t,nome:typeof c.nome==='string'?c.nome:b.cfg.nome,areas:c.areas||b.cfg.areas,formas:c.formas||b.cfg.formas,categorias:c.categorias||b.cfg.categorias};
  if(Array.isArray(c.abas))b.abas=c.abas.map((a,i)=>Object.assign({},a,{ordem:i+1,u:t}));
  b.produtos=(c.produtos||[]).map(p=>Object.assign({},p,{u:t}));
  b.fixos=[];Object.entries(c.fixos||{}).forEach(([abaId,arr])=>(arr||[]).forEach(f=>b.fixos.push({id:String(f.id),abaId,nome:f.nome,valor:+f.valor||0,u:t})));
  b.lanc=(d.lanc||[]).map(x=>{const y=Object.assign({},x,{u:x.pendente?1:t});delete y.area;delete y.tipo;return y});
  b.pagos={};Object.entries(d.pagos||{}).forEach(([m,o])=>Object.entries(o||{}).forEach(([fid,v])=>{if(v)b.pagos[m+'|'+fid]={v:true,u:t}}));
  if(c.sync)L.sync=Object.assign(L.sync,c.sync);
  L.importados=d.importados||[];L.backupEm=d.backupEm||null;
  return{S:b,L};
}
function normalize(d){
  if(d&&d.v===4&&d.cfg)return{S:mergeEstado(defaults(),d),L:null};
  if(d&&d.config&&Array.isArray(d.lanc)){if(!d.config.ver||d.config.ver<3)d=fromV2(d);return fromV3(d)}
  return{S:defaults(),L:null};
}
let S,L;
(function load(){
  let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  const n=normalize(raw);S=n.S;
  try{L=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){L=null}
  L=Object.assign(localDefaults(),L||{},n.L||{});L.sync=Object.assign(localDefaults().sync,L.sync||{});
})();
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(LKEY,JSON.stringify(L))}catch(e){toast('Não foi possível salvar neste aparelho')}}
function save(){saveLocal();schedulePush()}
saveLocal();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ===== Acesso aos dados ===== */
const C=()=>S.cfg;
const touchCfg=()=>{S.cfg.u=now()};
const today=new Date();
let cur=new Date(today.getFullYear(),today.getMonth(),1);
let area='pessoal';
const sel={};
try{const a=localStorage.getItem(KEY+':area');if(a==='merc')area='merc'}catch(e){}
const mKey=()=>cur.getFullYear()+'-'+pad(cur.getMonth()+1);
const isCurMonth=()=>cur.getFullYear()===today.getFullYear()&&cur.getMonth()===today.getMonth();
const defDate=()=>isCurMonth()?iso(new Date()):iso(cur);
const abasAll=()=>live(S.abas).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
const abasDe=a=>abasAll().filter(x=>x.area===a);
const aba=id=>live(S.abas).find(x=>x.id===id);
const areaNome=id=>(C().areas.find(a=>a.id===id)||{}).nome||'';
const forma=id=>C().formas.find(f=>f.id===id);
const formaCor=id=>{const i=C().formas.findIndex(f=>f.id===id);return PALETA[(i<0?0:i)%PALETA.length]};
const produtos=()=>live(S.produtos);
const produto=id=>produtos().find(p=>p.id===id);
const clientes=()=>live(S.clientes);
const cliente=id=>clientes().find(c=>c.id===id);
const isFiado=x=>{const a=aba(x.abaId);return a&&a.tipo==='fiado'};
const sinalDe=x=>{const k=aba(x.abaId).tipo;return k==='fiado'?(x.sub==='pag'?1:0):KINDS[k].sinal};
function contaCliente(cid){
  // aplica os pagamentos nos fiados mais antigos primeiro
  const mov=ativos().filter(x=>isFiado(x)&&x.clienteId===cid);
  const fiados=mov.filter(x=>x.sub!=='pag').sort((a,b)=>a.data.localeCompare(b.data)||(a.criado||0)-(b.criado||0));
  const pags=mov.filter(x=>x.sub==='pag');
  const total=sum(fiados),pago=sum(pags);let resto=pago;
  const aberto=[];
  fiados.forEach(f=>{if(resto>=f.valor-0.004){resto-=f.valor}else{aberto.push({f,falta:Math.round((f.valor-resto)*100)/100});resto=0}});
  const ult=mov.reduce((m,x)=>x.data>m?x.data:m,'');
  return{total,pago,saldo:Math.round((total-pago)*100)/100,aberto,mov,ult};
}
function waLink(c,conta){
  let t=String(c.tel||'').replace(/\D/g,'');if(!t)return null;if(t.length<=11)t='55'+t;
  const itens=conta.aberto.map(a=>{const p=produto(a.f.produtoId);return '• '+(a.f.qtd?fmtN(a.f.qtd)+' '+(p?p.unidade+' ':''):'')+(p?p.nome:'produto')+' ('+fmtDay(a.f.data)+')'+(a.falta<a.f.valor?' — falta '+brl(a.falta):'')}).join('\n');
  const msg='Olá, '+c.nome+'! Passando para lembrar do fiado em aberto: '+brl(conta.saldo)+'.'+(itens?'\n'+itens:'')+'\nObrigado!';
  return 'https://wa.me/'+t+'?text='+encodeURIComponent(msg);
}
const iniciais=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const fixosDe=abaId=>live(S.fixos).filter(f=>f.abaId===abaId);
const lancs=()=>live(S.lanc);
const ativos=()=>lancs().filter(x=>!x.pendente&&aba(x.abaId));
const doMes=()=>ativos().filter(x=>x.mes===mKey());
const pend=()=>lancs().filter(x=>x.pendente).sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0));
const pago=fid=>{const p=S.pagos[mKey()+'|'+fid];return !!(p&&p.v)};
function currentAba(){const list=abasDe(area);if(!list.length)return null;if(!list.some(a=>a.id===sel[area]))sel[area]=list[0].id;return aba(sel[area])}
function delRec(o){o.del=true;o.u=now()}

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2400)}
function arm(btn,fn,label){if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');const o=btn.textContent;btn.textContent=label||'Confirmar';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=o}},3000)}

/* ===== Fotos (guardadas no aparelho e enviadas ao Drive) ===== */
const FotoDB=(()=>{
  let dbp=null;const mem={};
  function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('financas-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
  return{
    async get(id){if(mem[id])return mem[id];try{const d=await db();return await new Promise(res=>{const q=d.transaction('f').objectStore('f').get(id);q.onsuccess=()=>{if(q.result)mem[id]=q.result;res(q.result||null)};q.onerror=()=>res(null)})}catch(e){return null}},
    async put(id,data){mem[id]=data;try{const d=await db();await new Promise(res=>{const t=d.transaction('f','readwrite');t.objectStore('f').put(data,id);t.oncomplete=res;t.onerror=res})}catch(e){}}
  };
})();
function resizeImage(file,max=1200,q=.72){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Não consegui abrir essa imagem'))};img.src=url})}
async function novaFoto(file){
  const data=await resizeImage(file);const id=uid('ft');
  await FotoDB.put(id,data);
  if(!L.fotosPend.includes(id))L.fotosPend.push(id);saveLocal();
  return id;
}
const baixando={};
async function fotoSrc(id){
  let d=await FotoDB.get(id);if(d)return d;
  const c=L.sync;if(!c.url)return null;
  if(!baixando[id])baixando[id]=(async()=>{try{const r=await fetch(apiUrl({acao:'foto',id}),{cache:'no-store'});const j=await r.json();if(j&&j.ok&&j.data){await FotoDB.put(id,j.data);return j.data}}catch(e){}return null})();
  const out=await baixando[id];if(!out)delete baixando[id];return out;
}
function hydrateFotos(root){(root||document).querySelectorAll('img[data-foto]:not([src])').forEach(async img=>{const s=await fotoSrc(img.dataset.foto);if(s)img.src=s;else img.closest('.thumb')?.classList.add('miss')})}
function thumb(id,cls){return id?`<span class="thumb ${cls||''}" data-ver="${id}"><img data-foto="${id}" alt="Foto"></span>`:''}
function verFoto(id){

function fotoField(id,label){return `<div class="field"><span class="flabel">${label}</span><div class="fotobox" id="${id}"></div><input type="file" accept="image/*" id="${id}-in" hidden></div>`}
function bindFoto(sh,id,st){
  const box=sh.querySelector('#'+id),inp=sh.querySelector('#'+id+'-in');
  function draw(){
    box.innerHTML=st.foto?`<span class="thumb big" data-ver="${st.foto}"><img data-foto="${st.foto}" alt="Foto"></span><div class="fbtns"><button type="button" data-f="trocar">Trocar foto</button><button type="button" data-f="tirar">Remover</button></div>`
      :`<button type="button" class="addfoto" data-f="trocar"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Adicionar foto</button>`;
    hydrateFotos(box);
  }
  box.addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;if(b.dataset.f==='trocar')inp.click();else{st.foto=null;draw()}});

/* ===== Estoque ===== */
function estoque(){
  const mov={};
  ativos().forEach(x=>{let k=aba(x.abaId).tipo;if(k==='fiado')k=x.sub==='pag'?'':'venda';if((k==='compra'||k==='venda')&&x.produtoId){const m=mov[x.produtoId]=mov[x.produtoId]||{c:0,v:0,cv:0};if(k==='compra'){m.c+=+x.qtd||0;m.cv+=+x.valor||0}else m.v+=+x.qtd||0}});
  return produtos().map(p=>{const m=mov[p.id]||{c:0,v:0,cv:0};const qtd=(+p.inicial||0)+m.c-m.v;const custo=m.c>0?m.cv/m.c:0;return{p,comprado:m.c,vendido:m.v,qtd,custo,valor:Math.max(0,qtd)*custo}});
}

function resumoArea(){
  const ids=new Set(abasDe(area).map(a=>a.id));
  const Lm=doMes().filter(x=>ids.has(x.abaId));
  let ent=0,sai=0;Lm.forEach(x=>{const s=sinalDe(x);if(s>0)ent+=x.valor;else if(s<0)sai+=x.valor});
  const fix=abasDe(area).filter(a=>a.tipo==='fixo').reduce((t,a)=>t+sum(fixosDe(a.id)),0);
  return{ent,sai,fix,saldo:ent-sai-fix,saidasL:Lm.filter(x=>sinalDe(x)<0)};
}

function itemRow(x){

  if((k==='compra'||k==='venda'||(k==='fiado'&&x.sub!=='pag'))&&x.qtd){const p=produto(x.produtoId),un=p?p.unidade:'un';meta.push(`<span>${fmtN(x.qtd)} ${esc(un)} · ${brl(x.valor/x.qtd)}/${esc(un)}</span>`)}

}
function listByDay(arr,emptyMsg){
  if(!arr.length)return `<div class="empty">${emptyMsg}</div>`;
  let last='',h='';
  [...arr].sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0)).forEach(x=>{
    if(x.data!==last){last=x.data;const d=fromIso(x.data);h+=`<div class="day">${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}</div>`}
    h+=itemRow(x)});

}

function vFiado(ab){

function fixosHTML(abaId){

    ${item?'':'<button type="button" class="ghost" id="lMais" hidden>Salvar e lançar outro produto para o mesmo cliente</button>'}`,sh=>{

    }
    fillProd();
    function unitInfo(){const v=money(q('#lVal').value),n=money(q('#lQtd').value);const p=produto(q('#lProd').value);const un=p?p.unidade:q('#lProdUn').value;q('#lUnit').textContent=(v>0&&n>0)?brl(v/n)+' por '+un:''}
    function sync(){
      press(q('#lArea'),st.area);
      q('#wAba').hidden=!st.area;
      const opts=st.area?lancaveis(st.area):[];
      if(st.area&&!opts.some(o=>o.id===st.abaId))st.abaId=opts[0]?opts[0].id:null;
      q('#lAba').innerHTML=opts.length?opts.map(o=>`<button type="button" data-v="${o.id}">${esc(o.nome)}</button>`).join(''):(st.area?'<span class="hint" style="margin:0">Nenhuma aba de lançamento nesta área. Crie uma pelo lápis ao lado das abas.</span>':'');
      press(q('#lAba'),st.abaId);
      const ab=st.abaId&&aba(st.abaId);
      q('#wCampos').hidden=!ab;
      if(!ab){q('#lSave').style.background='';q('#lSave').style.borderColor='';return}
      const k=ab.tipo,fi=k==='fiado',pag=fi&&st.sub==='pag',mv=k==='compra'||k==='venda'||(fi&&!pag);
      q('#wSub').hidden=!fi;q('#wCli').hidden=!fi;press(q('#lSub'),st.sub);
      q('#wNovoCli').hidden=!(fi&&q('#lCli').value==='__novo');
      const cc=fi&&cliente(q('#lCli').value);const ct=cc&&contaCliente(cc.id);
      q('#lCliInfo').textContent=ct?(ct.saldo>0.004?'Deve hoje '+brl(ct.saldo):'Está em dia'):'';
      if(pag&&ct&&ct.saldo>0.004&&!q('#lVal').value&&!item){q('#lVal').value=fmt2(ct.saldo)}
      q('#wProd').hidden=!mv;q('#wQtd').hidden=!mv;q('#wFoto').hidden=(!KINDS[k].foto||pag)&&!st.foto;
      if(q('#lMais'))q('#lMais').hidden=!(fi&&!pag);
      q('#wNovoProd').hidden=!(mv&&q('#lProd').value==='__novo');
      q('#lValL').textContent=pag?'Valor recebido (R$)':mv?'Valor total (R$)':'Valor (R$)';
      q('#lDescL').textContent=k==='compra'?'Fornecedor ou observação (opcional)':k==='venda'?'Cliente ou observação (opcional)':fi?'Observação (opcional)':k==='entrada'?'De onde veio':'O que foi';
      q('#lFormaL').textContent=(KINDS[k].sinal>0||pag)?'Recebeu por':'Pagou com';
      q('#wForma').hidden=!C().formas.length||(fi&&!pag);
      press(q('#lForma'),st.forma);
      q('#wCat').style.visibility=k==='saida'&&C().categorias.length?'visible':'hidden';
      const dEl=q('#lDesc');
      if(!item&&ab.area==='pessoal'&&k==='entrada'&&!dEl.value.trim()){dEl.value='Salário';dEl.dataset.auto='1'}
      else if(dEl.dataset.auto&&dEl.value==='Salário'&&k!=='entrada'){dEl.value='';delete dEl.dataset.auto}
      const col=ab.area==='pessoal'?'var(--acc-p)':'var(--acc-m)';q('#lSave').style.background=col;q('#lSave').style.borderColor=col;
      unitInfo();
    }
    sync();
    q('#lArea').onclick=e=>{const b=e.target.closest('button');if(b){st.area=b.dataset.v;st.abaId=null;sync()}};
    q('#lAba').onclick=e=>{const b=e.target.closest('button');if(b){st.abaId=b.dataset.v;sync()}};
    q('#lForma').onclick=e=>{const b=e.target.closest('button');if(b){st.forma=b.dataset.v;sync()}};
    q('#lSub').onclick=e=>{const b=e.target.closest('button');if(b){st.sub=b.dataset.v;if(!item)q('#lVal').value='';sync()}};
    q('#lCli').onchange=()=>{st.cli=q('#lCli').value==='__novo'?null:q('#lCli').value;if(st.sub==='pag'&&!item)q('#lVal').value='';sync();if(q('#lCli').value==='__novo')q('#lCliNome').focus()};
    q('#lProd').onchange=()=>{st.prod=q('#lProd').value==='__novo'?null:q('#lProd').value;sync();if(q('#lProd').value==='__novo')q('#lProdNome').focus()};
    ['#lVal','#lQtd'].forEach(k=>q(k).addEventListener('input',unitInfo));q('#lProdUn').onchange=unitInfo;
    q('#lCancel').onclick=closeSheet;
    if(item)q('#lDel').onclick=e=>arm(e.target,()=>{delRec(S.lanc.find(z=>z.id===item.id)||item);save();closeSheet();render();toast(isPend?'Compra ignorada':'Lançamento excluído');if(isPend&&pend().length)openInbox()});
    if(!item&&st.abaId)setTimeout(()=>{const ab=aba(st.abaId);if(!ab)return;const el=ab.tipo==='fiado'?q('#lCli'):(ab.tipo==='compra'||ab.tipo==='venda')?q('#lProd'):q('#lVal');el&&el.isConnected&&el.focus()},60);
    const salvar=(mais)=>{
      const err=q('#lErr'),fail=m=>{err.textContent=m;err.hidden=false};
      if(!st.area)return fail('Escolha a área.');
      const ab=st.abaId&&aba(st.abaId);if(!ab)return fail('Escolha a aba.');
      const k=ab.tipo,fi=k==='fiado',pag=fi&&st.sub==='pag',mv=k==='compra'||k==='venda'||(fi&&!pag);
      const v=money(q('#lVal').value),desc=q('#lDesc').value.trim(),dt=q('#lData').value;
      let prodId=null,qtd=null,cliId=null;
      if(fi){
        if(q('#lCli').value==='__novo'){
          const nome=q('#lCliNome').value.trim();if(!nome)return fail('Digite o nome do cliente.');
          const ex=clientes().find(c=>c.nome.toLowerCase()===nome.toLowerCase());
          cliId=ex?ex.id:uid('cl');
          if(!ex)S.clientes.push({id:cliId,nome,tel:q('#lCliTel').value.trim(),obs:'',u:now()});
        }else{cliId=q('#lCli').value;if(!cliId)return fail('Escolha o cliente.')}
      }
      if(mv){
        if(q('#lProd').value==='__novo'){
          const nome=q('#lProdNome').value.trim();if(!nome)return fail('Digite o nome do novo produto.');
          const ex=produtos().find(p=>p.nome.toLowerCase()===nome.toLowerCase());
          prodId=ex?ex.id:uid('pr');
          if(!ex)S.produtos.push({id:prodId,nome,unidade:q('#lProdUn').value,inicial:0,minimo:0,foto:null,u:now()});
        }else{prodId=q('#lProd').value;if(!prodId)return fail('Escolha o produto.')}
        qtd=money(q('#lQtd').value);if(!(qtd>0))return fail('Coloque quantas unidades, por exemplo 12.');
      }
      if(!(v>0))return fail('Digite um valor maior que zero, por exemplo 35,90.');
      if(!mv&&!fi&&!desc)return fail('Escreva uma descrição curta.');
      if(!dt)return fail('Escolha a data.');
      const body={abaId:ab.id,valor:Math.round(v*100)/100,desc,data:dt,mes:dt.slice(0,7),forma:C().formas.length?st.forma:null,cat:k==='saida'?q('#lCat').value:null,produtoId:prodId,qtd,foto:pag?null:(st.foto||null),clienteId:cliId,sub:fi?st.sub:null,u:now()};
      if(fi&&!pag)body.forma=null;
      const atual=item&&S.lanc.find(z=>z.id===item.id);
      if(atual){Object.assign(atual,body);delete atual.pendente;delete atual.del}
      else S.lanc.push(Object.assign({id:item?item.id:uid('l'),criado:item&&item.criado||now()},body));
      save();closeSheet();
      area=ab.area;sel[area]=ab.id;if(body.mes!==mKey())cur=fromIso(body.mes+'-01');
      render();toast(isPend?'Compra detalhada':item?'Lançamento atualizado':pag?'Pagamento registrado':fi?'Fiado registrado':'Lançamento salvo');
      if(isPend&&pend().length)setTimeout(openInbox,350);
      else if(mais)setTimeout(()=>openLanc(null,{abaId:ab.id,sub:'venda',clienteId:cliId,data:dt}),250);
      else if(preset.voltarCliente&&cliId)setTimeout(()=>openCliente(cliId),250);
    };
    q('#lSave').onclick=()=>salvar(false);
    if(q('#lMais'))q('#lMais').onclick=()=>salvar(true);
  });
}

function apiUrl(params){const c=L.sync;const p=Object.assign({token:c.token,t:now()},params||{});return c.url+(c.url.includes('?')?'&':'?')+Object.entries(p).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&')}
async function post(body){const r=await fetch(L.sync.url,{method:'POST',body:JSON.stringify(Object.assign({token:L.sync.token},body))});let j;try{j=await r.json()}catch(e){throw new Error('o link não respondeu como esperado')}if(!j||!j.ok)throw new Error(j&&j.erro==='token'?'o código secreto não confere com o do script':j&&j.erro==='versao'?'o script da planilha está desatualizado':'resposta inválida do script');return j}
let syncing=false,again=false,pushT=null,lastAuto=0;
function schedulePush(){if(!L.sync.url)return;clearTimeout(pushT);pushT=setTimeout(()=>syncAll(false),1500);syncBadge()}
function syncBadge(){
  const b=$('#syncBtn');if(!b)return;
  if(!L.sync.url){b.hidden=true;return}
  b.hidden=false;b.className='syncpill'+(syncing?' run':L.sync.erro?' err':'');
  b.textContent=syncing?'sincronizando…':L.sync.erro?'sem sincronizar · tocar':'sincronizado';
}
async function syncAll(manual){
  if(!L.sync.url){if(manual)toast('Configure a sincronização em Ajustes');return false}
  if(syncing){again=true;return false}
  syncing=true;syncBadge();
  let ok=true;
  try{
    // 1) fotos novas
    for(const id of [...L.fotosPend]){const data=await FotoDB.get(id);if(data)await post({acao:'foto',id,data});L.fotosPend=L.fotosPend.filter(x=>x!==id);saveLocal()}
    // 2) envia e recebe os dados (o script junta os dois lados)
    const enviado=JSON.stringify(S);
    const j=await post({acao:'estado',estado:S});
    S=mergeEstado(j.estado||{},S);
    // 3) compras novas do Apple Pay
    const r=await fetch(apiUrl({}),{cache:'no-store'});const ap=await r.json();
    let novos=0;
    if(ap&&ap.ok)(ap.itens||[]).forEach(it=>{
      if(!it||!it.id)return;const lid='ap-'+it.id;
      if(S.lanc.some(x=>x.id===lid)||L.importados.includes(it.id))return;
      L.importados.push(it.id);
      const v=money(it.valor);let dt=new Date(it.quando);if(isNaN(dt))dt=new Date();const data=iso(dt);
      S.lanc.push({id:lid,pendente:true,origem:'applepay',valor:isNaN(v)?0:Math.round(v*100)/100,desc:String(it.local||'Compra Apple Pay'),local:String(it.local||''),cartao:String(it.cartao||''),data,mes:data.slice(0,7),forma:guessForma(it.cartao),criado:now(),u:1});
      novos++});
    L.importados=L.importados.slice(-3000);
    L.sync.lastSync=now();L.sync.erro=null;saveLocal();
    if(JSON.stringify(S)!==enviado||novos)render();else syncBadge();
    if(novos)toast(novos===1?'1 compra nova do Apple Pay':novos+' compras novas do Apple Pay');
    else if(manual)toast('Tudo sincronizado');
  }catch(e){ok=false;L.sync.erro=String(e.message||'sem conexão');saveLocal();if(manual)toast('Não sincronizou: '+L.sync.erro)}
  finally{syncing=false;syncBadge();if(again){again=false;setTimeout(()=>syncAll(false),300)}}
  return ok;
}
function autoSync(){if(Date.now()-lastAuto<15000)return;lastAuto=Date.now();syncAll(false)}
async function sendTest(){
  if(!L.sync.url){toast('Cole o link do script primeiro');return}
  try{await post({valor:'R$ 1,00',local:'Teste do app',cartao:'Teste'});toast('Compra de teste enviada');setTimeout(()=>syncAll(true),1200)}
  catch(e){toast('Não consegui enviar: '+(e.message||'sem conexão'))}
}
function linkConexao(){return location.href.split('#')[0]+'#conectar='+encodeURIComponent(btoa(JSON.stringify({u:L.sync.url,t:L.sync.token})))}
function lerConexao(txt){try{const m=String(txt).match(/conectar=([^&\s]+)/);if(!m)return null;const o=JSON.parse(atob(decodeURIComponent(m[1])));if(o&&o.u&&o.t)return o}catch(e){}return null}
function scriptCode(token){return `// Minhas Finanças: sincronização entre aparelhos + fotos + Apple Pay
// Cole este código em Extensões > Apps Script da sua planilha (conta Google pessoal).
const TOKEN = '${token}';

// Pasta no seu Google Drive onde ficam os dados e as fotos do app
function pasta_() {
  const props = PropertiesService.getScriptProperties();
  const id = props.getProperty('PASTA');
  if (id) { try { return DriveApp.getFolderById(id); } catch (e) {} }
  const f = DriveApp.createFolder('Minhas Finanças · dados');
  props.setProperty('PASTA', f.getId());
  return f;
}
function arquivo_(nome) {
  const it = pasta_().getFilesByName(nome);
  return it.hasNext() ? it.next() : null;
}
function lerEstado_() {
  const f = arquivo_('estado.json');
  if (!f) return null;
  try { return JSON.parse(f.getBlob().getDataAsString('UTF-8')); } catch (e) { return null; }
}
function gravarEstado_(obj) {
  const texto = JSON.stringify(obj);
  const f = arquivo_('estado.json');
  if (f) f.setContent(texto); else pasta_().createFile('estado.json', texto, MimeType.PLAIN_TEXT);
}

// Aba da planilha que recebe as compras do Apple Pay
function aba_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName('ApplePay');
  if (!sh) {
    sh = ss.insertSheet('ApplePay');
    sh.appendRow(['id', 'recebido_em', 'valor', 'local', 'cartao']);
    sh.setFrozenRows(1);
  }
  return sh;
}

function resposta_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

// Junta os dados de dois aparelhos sem perder nada (o mesmo código roda no app)
${mergeEstado.toString()}

function doPost(e) {
  let dados = {};
  try { dados = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (err) {}
  dados = Object.assign({}, (e && e.parameter) || {}, dados);
  if (dados.token !== TOKEN) return resposta_({ ok: false, erro: 'token' });

  // 1) Sincronização dos dados do app
  if (dados.acao === 'estado') {
    const trava = LockService.getScriptLock();
    trava.waitLock(25000);
    try {
      const junto = mergeEstado(lerEstado_(), dados.estado);
      gravarEstado_(junto);
      return resposta_({ ok: true, estado: junto });
    } finally { trava.releaseLock(); }
  }

  // 2) Fotos
  if (dados.acao === 'foto') {
    const id = String(dados.id || '');
    if (!/^[A-Za-z0-9_-]+$/.test(id)) return resposta_({ ok: false, erro: 'id' });
    const nome = 'foto-' + id + '.jpg';
    if (!arquivo_(nome)) {
      const b64 = String(dados.data || '').replace(/^data:image\\/[a-z]+;base64,/, '');
      pasta_().createFile(Utilities.newBlob(Utilities.base64Decode(b64), 'image/jpeg', nome));
    }
    return resposta_({ ok: true });
  }

  // 3) Compra enviada pelo Atalhos do iPhone (Apple Pay)
  const id = Utilities.getUuid();
  aba_().appendRow([id, new Date(), "'" + String(dados.valor || ''),
    "'" + String(dados.local || ''), "'" + String(dados.cartao || '')]);
  return resposta_({ ok: true, id: id });
}

function doGet(e) {
  const p = (e && e.parameter) || {};
  if (p.token !== TOKEN) return resposta_({ ok: false, erro: 'token' });

  if (p.acao === 'foto') {
    const f = arquivo_('foto-' + String(p.id || '') + '.jpg');
    if (!f) return resposta_({ ok: false, erro: 'sem-foto' });
    return resposta_({ ok: true, data: 'data:image/jpeg;base64,' + Utilities.base64Encode(f.getBlob().getBytes()) });
  }
  if (p.acao === 'estado') return resposta_({ ok: true, estado: lerEstado_() });

  // Últimas compras do Apple Pay para o app
  const sh = aba_();
  const ultima = sh.getLastRow();
  if (ultima < 2) return resposta_({ ok: true, itens: [] });
  const inicio = Math.max(2, ultima - 299);
  const linhas = sh.getRange(inicio, 1, ultima - inicio + 1, 5).getValues();
  const itens = linhas.filter(r => r[0]).map(r => ({
    id: String(r[0]),
    quando: r[1] instanceof Date ? r[1].toISOString() : String(r[1]),
    valor: String(r[2]), local: String(r[3]), cartao: String(r[4])
  }));
  return resposta_({ ok: true, itens: itens });
}
`}

function fromMeusGastos(d){

  (d.gastos||[]).forEach(g=>n.lanc.push({id:'mg-'+g.id,abaId:'p-gastos',valor:+g.valor||0,desc:g.descricao||'Gasto',data:g.data,mes:(g.data||'').slice(0,7),forma:g.forma||'pix',cat:g.categoria||'Outros',criado:g.criado||0,u:t}));
  Object.entries(d.months||{}).forEach(([k,m])=>{(m.entradas||[]).forEach(e=>n.lanc.push({id:'mg-'+e.id,abaId:'p-entradas',valor:+e.valor||0,desc:e.desc||'Entrada',data:e.data||k+'-01',mes:(e.data||k+'-01').slice(0,7),criado:0,u:t}));Object.entries(m.pagos||{}).forEach(([fid,v])=>{if(v)n.pagos[k+'|mg-'+fid]={v:true,u:t}})});

    <div class="list">${p.map(x=>`<button class="item" data-pe="${x.id}"><span class="t">${esc(x.local||x.desc||'Compra')}</span><span class="v">${brl(x.valor)}</span><span class="m"><span class="tag ap">Apple Pay</span><span>${fmtDay(x.data)}${x.cartao?' · '+esc(x.cartao):''}</span></span><span></span></button>`).join('')}</div>
    <div class="acts"><button type="button" id="iSync">Buscar novas</button><button type="button" class="pri" id="iClose">Fechar</button></div>`,sh=>{
    sh.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>openLanc(S.lanc.find(z=>z.id===b.dataset.pe)));
    sh.querySelector('#iClose').onclick=closeSheet;
    sh.querySelector('#iSync').onclick=async()=>{await syncAll(true);openInbox()};
  });
}

render();
syncAll(false);
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
